```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    

    <title>Login | Welcome Back</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-wrapper">
        <form class="form" action="#" method="post">

            <h1 class="heading">Welcome Back</h1>
            <p class="subtitle">Please enter your details to sign in.</p>

            <div class="input-group">
               
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
               
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-options">
                <label class="remember-option" for="remember">
                    <input
                        id="remember"
                        name="remember"
                        type="checkbox"
                    >
                    Remember me
                </label>

                <a href="#">Forgot password?</a>
            </div>

            <button class="btn" type="submit">Log In</button>

            <p class="signup-text">
                Don't have an account?
                <a href="#">Sign up</a>
            </p>

        </form>
    </main>

</body>
</html>
```
